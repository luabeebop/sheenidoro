<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#000000"/>

  <!-- HUD corner brackets -->
  <g stroke="#ff0033" stroke-width="12" fill="none">
    <path d="M40,116 L40,40 L116,40"/>
    <path d="M396,40 L472,40 L472,116"/>
    <path d="M40,396 L40,472 L116,472"/>
    <path d="M472,396 L472,472 L396,472"/>
  </g>

  <!-- tick ring -->
  <g stroke="#2c3238" stroke-width="8">
    <line x1="256" y1="106" x2="256" y2="134"/>
    <line x1="256" y1="378" x2="256" y2="406"/>
    <line x1="106" y1="256" x2="134" y2="256"/>
    <line x1="378" y1="256" x2="406" y2="256"/>
  </g>

  <!-- track -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#1e2227" stroke-width="18"/>
  <!-- progress arc: 70%, starts at 12 o'clock -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#ff0033" stroke-width="18"
          stroke-dasharray="804.2" stroke-dashoffset="241.3"
          transform="rotate(-90 256 256)" filter="url(#g)"/>

  <!-- leading head marker -->
  <rect x="150" y="330" width="26" height="26" fill="#ff0033" filter="url(#g)"/>

  <!-- centre readout -->
  <text x="256" y="284" text-anchor="middle" font-family="Inconsolata, JetBrains Mono, monospace"
        font-size="104" font-weight="700" fill="#ffffff" letter-spacing="2">25</text>
</svg>
